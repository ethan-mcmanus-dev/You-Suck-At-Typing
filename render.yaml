services:
  - type: web
    name: ysat-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >
      PYTHONPATH=backend:ml
      uvicorn backend.api.main:app
      --host 0.0.0.0
      --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://you-suck-at-typing.vercel.app
      - key: MODEL_ARTIFACT_PATH
        value: model_artifacts/clusters_v1.json
    healthCheckPath: /health
